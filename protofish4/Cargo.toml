[package]
name = "protofish4"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Tokio UDP binding for protofish4: NACK-retransmitted dual (reliable/unreliable) transfer."

[dependencies]
bytes = "1.12.1"
protofish4-proto = { path = "../protofish4-proto", version = "0.1.0" }
rand = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
tracing = "0.1"
